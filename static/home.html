<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Vazeer Shaik</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.47;
            -webkit-font-smoothing: antialiased;
        }
        .shell {
            width: min(820px, calc(100% - 32px));
            margin: 0 auto;
            padding: 20px 0 48px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 22px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 999px;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset, 0 8px 24px rgba(0, 0, 0, 0.04);
        }
        .brand {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #1d1d1f;
            text-decoration: none;
        }
        nav { display: flex; gap: 6px; }
        nav a {
            font-size: 14px;
            color: #6e6e73;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 999px;
        }
        nav a:hover { background: rgba(0, 0, 0, 0.04); color: #1d1d1f; }
        nav a.active {
            background: #1d1d1f;
            color: #fff;
        }
        main { padding: 56px 8px 0; }
        .hero {
            background: #fff;
            border-radius: 32px;
            padding: 56px 48px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }
        .kicker {
            font-size: 13px;
            font-weight: 600;
            color: #6e6e73;
            letter-spacing: 0.02em;
            margin-bottom: 12px;
        }
        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 600;
            letter-spacing: -0.035em;
            line-height: 1.07;
            margin-bottom: 16px;
        }
        .lead {
            font-size: 19px;
            color: #6e6e73;
            max-width: 28em;
            margin-bottom: 32px;
            font-weight: 400;
        }
        .pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 32px;
        }
        .pills span {
            font-size: 13px;
            color: #6e6e73;
            background: #f5f5f7;
            padding: 7px 14px;
            border-radius: 999px;
        }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; }
        button, .ghost {
            font: inherit;
            font-size: 15px;
            font-weight: 500;
            padding: 12px 22px;
            border-radius: 980px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            border: none;
        }
        button {
            background: #0071e3;
            color: #fff;
        }
        button:hover { background: #0077ed; }
        .ghost {
            background: #f5f5f7;
            color: #1d1d1f;
        }
        .ghost:hover { background: #e8e8ed; }
        #status {
            margin-top: 22px;
            min-height: 1.4em;
            font-size: 15px;
            color: #6e6e73;
        }
        #status.ok { color: #248a3d; }
        footer {
            text-align: center;
            padding: 40px 0 8px;
            font-size: 13px;
            color: #86868b;
        }
        @media (max-width: 640px) {
            header { border-radius: 24px; padding: 12px 16px; }
            .hero { padding: 36px 24px; border-radius: 24px; }
            h1 { font-size: 1.85rem; }
            .lead { font-size: 17px; }
            main { padding-top: 36px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <a class="brand" href="/home">Vazeer Shaik</a>
            <nav>
                <a class="active" href="/home">Home</a>
                <a href="/about">About</a>
            </nav>
        </header>

        <main>
            <section class="hero">
                <p class="kicker">Go web application</p>
                <h1>Simple. Reliable.<br>Ready to deploy.</h1>
                <p class="lead">
                    A small Go service for Docker, Kubernetes, Helm, and CI/CD practice.
                    Served on port 8080.
                </p>
                <div class="pills">
                    <span>Go net/http</span>
                    <span>Port 8080</span>
                    <span>/home · /about</span>
                </div>
                <div class="actions">
                    <button id="checkBtn" type="button">Check health</button>
                    <a class="ghost" href="/about">About</a>
                </div>
                <p id="status" aria-live="polite"></p>
            </section>
        </main>

        <footer>© 2026 Vazeer Shaik</footer>
    </div>

    <script>
        document.getElementById("checkBtn").addEventListener("click", function () {
            var el = document.getElementById("status");
            el.textContent = "Healthy. Pages are being served correctly.";
            el.className = "ok";
        });
    </script>
</body>
</html>
